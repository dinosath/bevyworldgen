# cargo-deny policy (license gate, ADR-001 / license-inventory.md).
[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }, { triple = "wasm32-unknown-unknown" }]

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unlicense", "MIT-0", "BSL-1.0", "CC0-1.0", "0BSD",
  "OFL-1.1", "Ubuntu-font-1.0", "NCSA", "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[advisories]
ignore = []
